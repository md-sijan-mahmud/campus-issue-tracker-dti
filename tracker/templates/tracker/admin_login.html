<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Campus Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }
        .btn-custom {
            background-color: #0d6efd;
            border: none;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            {% load static %}
            <img src="{% static 'tracker/DTI.png' %}" alt="DTI Logo" style="height: 55px; object-fit: contain;" class="mb-3">
            <h4 class="fw-bold text-dark mb-1">Admin Portal</h4>
            <p class="text-muted small">Sign in to manage campus complaints & IT tracker</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small rounded-3 mb-3" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control bg-light border-start-0 shadow-none py-2" placeholder="Enter admin username" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 rounded-start-3"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control bg-light border-start-0 shadow-none py-2" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-custom text-white w-100 shadow-sm">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Secure Login
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'home' %}" class="text-decoration-none small text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Live Site
            </a>
        </div>
    </div>

</body>
</html>
